<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-template</title>
<style>
  /* Source for public/og-template.png (1200x630). Rebuild with: node scripts/make-brand-assets.mjs */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px;
    font-family: system-ui, 'Segoe UI', Roboto, Arial, sans-serif; color: #ffffff;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); position: relative; overflow: hidden;
  }
  body::before, body::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
  body::before { width: 520px; height: 520px; right: -120px; top: -160px; }
  body::after { width: 360px; height: 360px; right: 140px; bottom: -200px; }
  .mark { width: 96px; height: 96px; border-radius: 22px; background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.5);
          display: grid; place-items: center; font-size: 56px; font-weight: 800; letter-spacing: -1px; margin-bottom: 40px; }
  h1 { margin: 0; font-size: 84px; line-height: 1.05; letter-spacing: -2px; font-weight: 800; max-width: 900px; position: relative; z-index: 1; }
  p { margin: 28px 0 0; font-size: 34px; opacity: .92; position: relative; z-index: 1; }
  .site { position: absolute; left: 96px; bottom: 56px; font-size: 30px; font-weight: 700; opacity: .95; z-index: 1; }
</style>
</head>
<body>
  <div class="mark">O</div>
  <h1>Exact calculators for people and AI agents</h1>
  <p>Free · Formula shown · Worked examples</p>
  <div class="site">opuscalculator.com</div>
</body>
</html>
