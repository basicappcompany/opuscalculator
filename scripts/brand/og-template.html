<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-template</title>
<style>
  /* Source for public/og-template.png (1200x630). Rebuild with: node scripts/make-brand-assets.mjs */
  @font-face { font-family: 'Newsreader'; src: url('../../public/fonts/newsreader-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Hanken'; src: url('../../public/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px;
    font-family: 'Hanken', system-ui, 'Segoe UI', Arial, sans-serif; color: #ffffff;
    background: radial-gradient(900px 600px at 100% 100%, #2a2f86 0%, rgba(42,47,134,0) 70%), linear-gradient(160deg, #0b1030, #131c52);
    position: relative; overflow: hidden;
  }
  .mark { position: absolute; right: 84px; top: 84px; width: 300px; height: 300px; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; letter-spacing: .01em; margin-bottom: 36px; }
  .brand svg { width: 56px; height: 56px; }
  h1 { margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 88px; line-height: 1.04; letter-spacing: -2px; font-weight: 500; max-width: 760px; }
  p { margin: 28px 0 0; font-size: 32px; color: #b8c2e6; }
  .site { position: absolute; left: 96px; bottom: 52px; font-size: 28px; font-weight: 600; color: #8ea6ff; letter-spacing: .02em; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#7a5cff"/><stop offset="1" stop-color="#1fb6ff"/></linearGradient></defs>
    <circle cx="32" cy="32" r="20" fill="none" stroke="url(#r)" stroke-width="5"/>
    <circle cx="52" cy="32" r="7" fill="#ffb020"/><circle cx="22" cy="49.3" r="7" fill="#12c2b0"/><circle cx="22" cy="14.7" r="7" fill="#ff4fa3"/>
  </svg>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="20" fill="none" stroke="url(#r)" stroke-width="5"/><circle cx="52" cy="32" r="7" fill="#ffb020"/><circle cx="22" cy="49.3" r="7" fill="#12c2b0"/><circle cx="22" cy="14.7" r="7" fill="#ff4fa3"/></svg>
    Opus Calculator
  </div>
  <h1>Exact calculators for people and AI agents</h1>
  <p>Free · Formula shown · Worked examples</p>
  <div class="site">opuscalculator.com</div>
</body>
</html>
